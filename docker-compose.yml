services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Defina NEXT_PUBLIC_SUPABASE_URL no .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Defina NEXT_PUBLIC_SUPABASE_ANON_KEY no .env}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: ${PORT:-3003}
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_SCHEME:-https}://${DOMAIN:?Defina DOMAIN no .env}
    restart: unless-stopped
    expose:
      - "${PORT:-3003}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.care-copilot.rule=Host(`${DOMAIN:?Defina DOMAIN no .env}`)"
      - "traefik.http.routers.care-copilot.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.care-copilot.tls=true"
      - "traefik.http.routers.care-copilot.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.care-copilot.loadbalancer.server.port=${PORT:-3003}"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
